name: Quality and security
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Build-time settings only. No database is used in CI: the API tests run on an in-memory fixture database.
      CORS_ORIGINS: https://ci.example.test
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: /api
      ALLOW_DB_WRITES: 'false'
      SEARCH_INDEXING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: node scripts/check-versions.mjs
      - run: npm ci
      - run: node scripts/security-audit.mjs
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
